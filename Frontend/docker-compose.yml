services:

  ms-frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    container_name: ms-frontend
    ports:
      - "80:80"     # acceso directo: http://localhost (requiere el puerto 80 libre en el host)
      - "3000:80"   # se mantiene el puerto documentado en el README
    depends_on:
      - ms-gateway
