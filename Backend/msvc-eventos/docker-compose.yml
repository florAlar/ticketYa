services:

  ms-eventos:
    build: .
    container_name: ms-eventos
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-mysql-eventos:3306/eventos
      SPRING_DATASOURCE_USERNAME: ticketya
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ticketya_dev}
      TICKETYA_URI_ENTRADAS: http://ms-entradas:8084
      TICKETYA_URI_VENTAS: http://ms-ventas:8083
    depends_on:
      db-mysql-eventos:
        condition: service_healthy

  db-mysql-eventos:
    image: mysql:8.4
    container_name: db-mysql-eventos
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eventos
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ticketya_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "3308:3306"
    volumes:
      - eventos_data:/var/lib/mysql
      - ../infrastructure/mysql/eventos:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventos_data:
