server:
  port: 8082

spring:
  application:
    name: msvc-eventos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/eventos}
    username: ${SPRING_DATASOURCE_USERNAME:ticketya}
    password: ${SPRING_DATASOURCE_PASSWORD:ticketya_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# msvc-entradas (Feign reintegro cancelación). Docker: http://ms-entradas:8084
ticketya:
  uri:
    entradas: ${TICKETYA_URI_ENTRADAS:http://localhost:8084}
    ventas: ${TICKETYA_URI_VENTAS:http://localhost:8083}

# E2-NFR-03: correlation id en cada línea de log
logging:
  pattern:
    level: "%5p [${spring.application.name:app},%X{correlationId:-}]"
