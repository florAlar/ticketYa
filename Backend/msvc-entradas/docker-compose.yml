services:

  ms-entradas:
    build: .
    container_name: ms-entradas
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-mysql-entradas:3306/entradas
      SPRING_DATASOURCE_USERNAME: ticketya
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ticketya_dev}
      TICKETYA_URI_EVENTOS: http://ms-eventos:8082
      TICKETYA_URI_VENTAS: http://ms-ventas:8083
    depends_on:
      db-mysql-entradas:
        condition: service_healthy

  db-mysql-entradas:
    image: mysql:8.4
    container_name: db-mysql-entradas
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: entradas
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ticketya_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "3310:3306"
    volumes:
      - entradas_data:/var/lib/mysql
      - ../infrastructure/mysql/entradas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  entradas_data:
