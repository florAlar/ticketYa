server:
  port: 8084

spring:
  application:
    name: msvc-entradas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/entradas}
    username: ${SPRING_DATASOURCE_USERNAME:ticketya}
    password: ${SPRING_DATASOURCE_PASSWORD:ticketya_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Feign: eventos (enriquecer DTO), ventas (liberar cupo al approve).
ticketya:
  uri:
    eventos: ${TICKETYA_URI_EVENTOS:http://localhost:8082}
    ventas: ${TICKETYA_URI_VENTAS:http://localhost:8083}
  entradas:
    plazo-devolucion-horas: ${TICKETYA_DEVOLUCION_HORAS:72}
