include:
  - path: ../infrastructure/rabbitmq/docker-compose.yml

services:

  ms-preferencias:
    build: .
    container_name: ms-preferencias
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      SPRING_MONGODB_URI: mongodb://ticketya:${MONGO_PASSWORD:-mongo_dev}@db-mongo-preferencias:27017/preferencias?authSource=admin
      # Compatibilidad con la variable vieja (Spring Boot < 4)
      SPRING_DATA_MONGODB_URI: mongodb://ticketya:${MONGO_PASSWORD:-mongo_dev}@db-mongo-preferencias:27017/preferencias?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ticketya
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticketya_dev}
      TICKETYA_URI_EVENTOS: http://ms-eventos:8082
      TICKETYA_URI_VENTAS: http://ms-ventas:8083
      TICKETYA_INTERNAL_TOKEN: ${TICKETYA_INTERNAL_TOKEN:-ticketya_dev_internal}
    depends_on:
      db-mongo-preferencias:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db-mongo-preferencias:
    image: mongo:7.0
    container_name: db-mongo-preferencias
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ticketya
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_dev}
      MONGO_INITDB_DATABASE: preferencias
    ports:
      - "27018:27017"
    volumes:
      - preferencias_data:/data/db
      - ../infrastructure/mongodb/preferencias:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  preferencias_data:
