services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ticketya
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticketya_dev}
    ports:
      - "5672:5672"     # conexión de las apps
      - "15672:15672"   # panel web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq_data:
