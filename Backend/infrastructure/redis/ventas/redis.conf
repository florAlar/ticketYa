# Redis — msvc-ventas (dev TicketYa)
# Montado en db-redis-ventas. Persistencia AOF para TTL/stock temporal.

bind 0.0.0.0
protected-mode no
port 6379

# Persistencia (reservas / claves con TTL)
appendonly yes
appendfsync everysec

# Memoria acotada en dev
maxmemory 256mb
maxmemory-policy volatile-lru

# Logs razonables en contenedor
loglevel notice
