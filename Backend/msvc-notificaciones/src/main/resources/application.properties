spring.application.name=msvc-notificaciones
server.port=8086

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3311/notificaciones}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticketya}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ticketya_dev}

# Email real por SMTP (MailHog en local). En Docker Compose el host es mailhog:1025.
# ticketya.notificaciones.email.provider=smtp activa SmtpEmailProvider; mock (default) no envía.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
ticketya.notificaciones.email.provider=${TICKETYA_NOTIF_EMAIL_PROVIDER:mock}
ticketya.notificaciones.email.remitente=${TICKETYA_NOTIF_EMAIL_REMITENTE:no-reply@ticketya.local}
ticketya.notificaciones.email.destino-default=${TICKETYA_NOTIF_EMAIL_DESTINO_DEFAULT:destinatarios@ticketya.local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Broker de eventos de dominio (msvc-eventos publica evento.# en eventos.exchange)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:ticketya}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:ticketya_dev}
# Reintentos acotados; al agotarse el mensaje va a notificaciones.eventos.dlq
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# msvc-ventas (destinatarios de la notificación: clientes con compra APROBADA)
ticketya.uri.ventas=${TICKETYA_URI_VENTAS:http://localhost:8083}
# msvc-preferencias (artistas/ciudades favoritos y preferencias de canal)
ticketya.uri.preferencias=${TICKETYA_URI_PREFERENCIAS:http://localhost:8085}
# msvc-usuarios (email del destinatario para el canal EMAIL)
ticketya.uri.usuarios=${TICKETYA_URI_USUARIOS:http://localhost:8081}

# Job de entrega (E2-NOT-01): cada 30 s toma hasta 50 PENDIENTE y registra intento_envio
ticketya.notificaciones.envio.intervalo-ms=${TICKETYA_NOTIF_ENVIO_INTERVALO_MS:30000}
ticketya.notificaciones.envio.max-intentos=${TICKETYA_NOTIF_ENVIO_MAX_INTENTOS:3}
ticketya.notificaciones.envio.lote=${TICKETYA_NOTIF_ENVIO_LOTE:50}

# E2-NFR-03: correlation id en cada línea de log
logging.pattern.level=%5p [${spring.application.name:app},%X{correlationId:-}]
