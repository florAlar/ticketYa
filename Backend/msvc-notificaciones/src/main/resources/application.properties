spring.application.name=msvc-notificaciones
server.port=8086

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3311/notificaciones}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticketya}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ticketya_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Broker de eventos de dominio (msvc-eventos publica evento.# en eventos.exchange)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:ticketya}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:ticketya_dev}
# Reintentos acotados; al agotarse el mensaje va a notificaciones.eventos.dlq
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# msvc-ventas (destinatarios de la notificación: clientes con compra APROBADA)
ticketya.uri.ventas=${TICKETYA_URI_VENTAS:http://localhost:8083}
