server:
  port: 8083

spring:
  application:
    name: msvc-ventas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/ventas}
    username: ${SPRING_DATASOURCE_USERNAME:ticketya}
    password: ${SPRING_DATASOURCE_PASSWORD:ticketya_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}

# msvc-eventos / msvc-entradas (Feign). Docker: http://ms-*:port
ticketya:
  uri:
    eventos: ${TICKETYA_URI_EVENTOS:http://localhost:8082}
    entradas: ${TICKETYA_URI_ENTRADAS:http://localhost:8084}
  ventas:
    reserva-ttl-minutes: ${TICKETYA_RESERVA_TTL_MINUTES:10}
    max-entradas-cliente-evento: ${TICKETYA_MAX_ENTRADAS:6}
    idempotency-ttl-hours: 24
    expire-job-ms: 30000
