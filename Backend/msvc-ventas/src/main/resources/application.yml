server:
  port: 8083

spring:
  application:
    name: msvc-ventas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/ventas}
    username: ${SPRING_DATASOURCE_USERNAME:ticketya}
    password: ${SPRING_DATASOURCE_PASSWORD:ticketya_dev}
    hikari:
      # 25-100 compradores concurrentes con Feign dentro de la transacción de reserva;
      # el default de 10 agotaba el pool y devolvía 500 bajo carga.
      maximum-pool-size: ${TICKETYA_DB_POOL:30}
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:ticketya}
    password: ${SPRING_RABBITMQ_PASSWORD:ticketya_dev}
  cloud:
    openfeign:
      client:
        config:
          # Solo el cliente de eventos: la fila no puede quedar colgada si se degrada.
          msvc-eventos:
            connectTimeout: 2000
            readTimeout: 3000

# msvc-eventos / msvc-entradas (Feign). Docker: http://ms-*:port
ticketya:
  uri:
    eventos: ${TICKETYA_URI_EVENTOS:http://localhost:8082}
    entradas: ${TICKETYA_URI_ENTRADAS:http://localhost:8084}
  interno:
    # Token compartido para /internas/** (no expuesto por el gateway).
    token: ${TICKETYA_INTERNAL_TOKEN:ticketya_dev_internal}
  ventas:
    reserva-ttl-minutes: ${TICKETYA_RESERVA_TTL_MINUTES:10}
    max-entradas-cliente-evento: ${TICKETYA_MAX_ENTRADAS:6}
    idempotency-ttl-hours: 24
    expire-job-ms: 30000
    # Emisión QR post-pago (Feign msvc-entradas): reintentos inmediatos + job
    emision-intentos-inmediatos: ${TICKETYA_EMISION_INTENTOS_INMEDIATOS:3}
    emision-delay-ms: ${TICKETYA_EMISION_DELAY_MS:250}
    emision-max-intentos: ${TICKETYA_EMISION_MAX_INTENTOS:20}
    emision-job-ms: ${TICKETYA_EMISION_JOB_MS:30000}
  # E2-FILA-01: cola en Redis (D1), fail-closed (D3), tanda automática + override ADMIN (D4)
  fila:
    key-prefix: ${TICKETYA_FILA_PREFIX:fila}
    ttl-hours: ${TICKETYA_FILA_TTL_HOURS:24}
    token-ttl-minutes: ${TICKETYA_FILA_TOKEN_TTL_MINUTES:10}
    evento-cache-ttl-seconds: ${TICKETYA_FILA_EVENTO_CACHE_TTL_SECONDS:10}
    auto:
      enabled: ${TICKETYA_FILA_AUTO_ENABLED:true}
      tamanio: ${TICKETYA_FILA_AUTO_TAMANIO:25}
      intervalo-ms: ${TICKETYA_FILA_AUTO_INTERVALO_MS:10000}
      lock-ms: ${TICKETYA_FILA_AUTO_LOCK_MS:8000}

# E2-NFR-03: correlation id en cada línea de log
logging:
  pattern:
    level: "%5p [${spring.application.name:app},%X{correlationId:-}]"
